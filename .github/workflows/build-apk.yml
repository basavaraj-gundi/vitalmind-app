name: Build VitalMind Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Install NPM Dependencies
        run: npm install

      - name: 5. Build Vite Production Web Bundle
        run: npm run build

      - name: 6. Add and Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 8. Assemble Installable APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: 9. Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitalMind-Pixel7-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30