name: Build VitalMind Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 5. Install NPM Dependencies
        run: npm install

      - name: 6. Build Vite Production Web Bundle
        run: npm run build

      - name: 7. Add and Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 8. Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 9. Assemble Installable APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: 10. Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitalMind-Pixel7-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30